<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/market.png') }}">

    <title>{% block title %}Supermarket POS{% endblock %}</title>

    <!-- Preloader styles -->
    <style>
        /* Critical preloader styles to prevent FOUC */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
    </style>

    <!-- Core Libraries - Order matters! -->
    <script src="{{ url_for('static', filename='vendor/jquery-3.7.1.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/jquery-ui.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>

    <!-- CSS Libraries -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/jquery-ui.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fontawesome/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    
    <!-- Additional CSS from child templates -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="preloader">
        <div class="loader">
            <div class="inner one"></div>
            <div class="inner two"></div>
            <div class="inner three"></div>
        </div>
    </div>
    {% include 'navbar.html' %}
    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Move scripts to end of body -->
    <script>
        // Verify libraries are loaded
        $(document).ready(function() {
            console.log('jQuery version:', $.fn.jquery);
            console.log('jQuery UI version:', $.ui?.version);
            console.log('Bootstrap version:', $.fn.tooltip.Constructor.VERSION);
        });

        async function handleLogout() {
            try {
                const response = await fetch('/logout');
                if (response.ok) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Logout failed:', error);
            }
        }

        // Initialize preloader
        const preloader = document.querySelector('.preloader');
        let loadedStyles = 0;
        const totalStyles = 3; // Total number of style sheets

        function hidePreloader() {
            preloader.classList.add('hidden');
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 20);
        }

        // Check when stylesheets are loaded
        document.querySelectorAll('link[rel="stylesheet"]').forEach(stylesheet => {
            stylesheet.onload = () => {
                loadedStyles++;
                if (loadedStyles === totalStyles) {
                    // All styles loaded
                    document.fonts.ready.then(() => {
                        // Fonts loaded
                        hidePreloader();
                    });
                }
            };
        });

        // Fallback if styles take too long
        setTimeout(hidePreloader, 100);
    </script>

    <!-- Additional scripts from child templates -->
    {% block extra_scripts %}{% endblock %}

    <style>
        .preloader {
            transition: opacity 0.3s ease-out;
        }

        .preloader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .loader .inner {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            animation: spin 1.5s linear infinite;
        }

        .loader .one {
            border-top-color: #3498db;
            animation-delay: 0s;
        }

        .loader .two {
            width: 60px;
            height: 60px;
            top: 10px;
            left: 10px;
            border-top-color: #e74c3c;
            animation-delay: 0.2s;
        }

        .loader .three {
            width: 40px;
            height: 40px;
            top: 20px;
            left: 20px;
            border-top-color: #2ecc71;
            animation-delay: 0.4s;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
