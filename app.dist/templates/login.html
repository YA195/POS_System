{% extends "base.html" %}

{% block title %}تسجيل الدخول - Supermarket POS{% endblock %}

{% block head %}
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <i class="fas fa-store-alt"></i>
            <h1>تسجيل الدخول</h1>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="اسم المستخدم" required>
                </div>
            </div>
            <div class="form-group">
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="كلمة المرور" required>
                    <i class="fas fa-eye-slash password-toggle" onclick="togglePassword()"></i>
                </div>
            </div>
            <button type="submit" class="login-btn">
                <span>دخول</span>
                <i class="fas fa-sign-in-alt"></i>
            </button>
        </form>
    </div>
</div>

<script>
    function submitLogin() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    fetch('/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Use the redirect URL from the response
            window.location.href = data.redirect;
        } else {
            alert(data.error || 'Login failed');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('An error occurred during login');
    });
}
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.querySelector('.password-toggle');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
    } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
    }
}
async function handleLogin(event) {
    event.preventDefault();
    const submitButton = event.target.querySelector('.login-btn');
    submitButton.disabled = true;
    submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });

        // **Check for non-JSON response (like an HTML error page)**
        if (!response.ok) {
            throw new Error('خطأ في الاتصال بالخادم');  // Handle server-side errors
        }

        const data = await response.json();

        if (data.success) {
            submitButton.innerHTML = '<i class="fas fa-check"></i> تم التسجيل بنجاح';
            window.location.replace(data.redirect_url); // Instead of window.location.href
        } else {
            throw new Error(data.error || 'خطأ في تسجيل الدخول');
        }
    } catch (error) {
        console.error('Login error:', error);
        submitButton.disabled = false;
        submitButton.innerHTML = '<span>دخول</span><i class="fas fa-sign-in-alt"></i>';
        alert(error.message || 'خطأ في الاتصال بالخادم');
    }
}

</script>
{% endblock %}
